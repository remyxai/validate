<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" role="img" aria-labelledby="title desc">
 <title id="title">Measure a change against your baseline</title><desc id="desc">Baseline and candidate enter a single approved plan. Run paired evaluations. Keep portable evidence and record a human decision. The next change can reuse the declaration.</desc>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#AE0019"/></marker></defs>
 <rect width="1040" height="440" rx="16" fill="#FCFAFA"/><rect x="1" y="1" width="1038" height="438" rx="15" fill="none" stroke="#DED7D9"/>
 <g font-family="Arial, Helvetica, sans-serif" fill="#222125"><text x="40" y="42" font-size="14" font-family="monospace" letter-spacing="1.7" fill="#AE0019">// CHANGE EVIDENCE</text><text x="40" y="80" font-size="30" font-weight="bold">From a proposed change to a decision.</text>
 <g font-size="15"><rect x="40" y="115" width="221" height="71" rx="8" fill="#FFFFFF" stroke="#C9C4C5"/><text x="56" y="144" font-size="19" font-weight="bold">Baseline</text><text x="56" y="168" fill="#555157">Current version</text><rect x="40" y="209" width="221" height="71" rx="8" fill="#FFFFFF" stroke="#C9C4C5"/><text x="56" y="238" font-size="19" font-weight="bold">Candidate</text><text x="56" y="262" fill="#555157">Proposed change</text>
 <path d="M261 150 H281 V245 H261" stroke="#AE0019" stroke-width="2" fill="none"/><path d="M281 197 H309" stroke="#AE0019" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
 <rect x="320" y="117" width="304" height="161" rx="8" fill="#F8EDEE" stroke="#D7A7AE"/><text x="339" y="144" font-family="monospace" font-size="13" fill="#AE0019">impact.yaml</text><text x="339" y="175" font-size="21" font-weight="bold">Review the plan</text><text x="339" y="200" fill="#51484C">Criteria · controls · budget</text><path d="M339 215 H603" stroke="#D7A7AE"/><text x="339" y="243" font-size="19" font-weight="bold">Run both versions</text><text x="339" y="264" fill="#51484C">Matched seeds or examples</text>
 <path d="M624 197 H665" fill="none" stroke="#AE0019" stroke-width="2" marker-end="url(#arrow)"/>
 <rect x="677" y="117" width="323" height="161" rx="8" fill="#FFFFFF" stroke="#AE0019" stroke-width="1.5"/><text x="696" y="144" font-family="monospace" font-size="13" fill="#AE0019">evidence.json + report.md</text><text x="696" y="175" font-size="21" font-weight="bold">Inspect the evidence</text><text x="696" y="201" fill="#555157">Metrics · uncertainty · validity</text><path d="M696 215 H981" stroke="#E4DADC"/><text x="696" y="243" font-size="19" font-weight="bold">Record a decision</text><text x="696" y="264" fill="#555157">Ship · revise · hold · drop</text>
 <path d="M837 278 V321 H472 V289" fill="none" stroke="#AE0019" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="496" y="346" font-size="15" fill="#850015">Reuse the criteria on the next change.</text></g>
 <path d="M40 370 H1000" stroke="#DED7D9"/><text x="40" y="401" font-size="15" fill="#555157">Local runner · Your tests and compute · Evidence stays local until you choose to share it</text></g>
</svg>
