# Riemannian-preconditioned LoRA optimizer, huggingface/peft#3382.
# Baseline: the commit the PR branched from, training LoRA with plain AdamW.
# Candidate: the PR head, training the same LoRA with create_riemannian_optimizer(AdamW).
spec_version: "0.1"
objective: Decide whether the Riemannian-preconditioned optimizer trains LoRA to a lower loss than AdamW at the same step budget.
change:
  family: optimizer
  hypothesis: With identical init, data and step count, r x r preconditioning of the LoRA gradients reaches a lower eval loss than plain AdamW.
  repo: https://github.com/huggingface/peft
  pr: https://github.com/huggingface/peft/pull/3382
  baseline: {ref: 3116c96b5d870851e8477eb99dfcf8471bac0e72}    # merge-base with main
  candidate: {ref: f90cc44e81dfbc9a91741f62b8d87d5d963843e7}   # PR #3382 head

harness:
  path: ./harness

# One environment per arm, built once and cached. CPU torch keeps it small.
# The main packages are pinned; their transitive dependencies are not locked.
setup:
  - uv venv -q --python 3.12 {env}/venv
  - uv pip install -q --python {env}/venv/bin/python torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
  - uv pip install -q --python {env}/venv/bin/python -e . transformers==5.24.1 accelerate==1.16.0 numpy==2.5.5

preflight:
  command: "{env}/venv/bin/python {harness}/bench.py"   # 5 steps under VALIDATE_SMOKE=1
  timeout_s: 300

run:
  command: "{env}/venv/bin/python {harness}/bench.py"
  timeout_s: 900
  retries: 0

# The new optimizer is opt-in, so the candidate arm has to ask for it.
arms:
  baseline: {env: {OPTIMIZER: adamw}}
  candidate: {env: {OPTIMIZER: riemannian}}

method:
  unit: seed
  seeds: [0, 1, 2, 3, 4]
  confidence: 0.95
  uncertainty: interval

criteria:
  - id: final_eval_loss
    metric: final_eval_loss
    role: target
    direction: lower
    min_improvement: 0
  - id: throughput
    metric: steps_per_s
    role: info
    direction: higher

validity:
  activation:
    - metric: optimizer_preconditioned
  held_constant: [num_trainable_params, train_steps, initial_eval_loss]

# Trusted on purpose: this PR is merged upstream and we read it. Make that
# choice yourself for any other pull request.
execution:
  backend: local
  trust: trusted

budget:
  max_wall_s: 3600

data:
  identity: synthetic-lora-teacher-student-v1
  description: Synthetic regression against a rank-4 perturbed two-layer MLP; generated from the seed, no external data.
